<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Powerball">
<meta name="theme-color" content="#0a0a1a">
<title>Powerball 予測</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0a0a1a; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #0a0a1a;
    color: #fff;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .safe-top { height: env(safe-area-inset-top, 44px); }
  .safe-bottom { height: env(safe-area-inset-bottom, 20px); }
  .app { padding: 16px 16px 32px; }
  .header { text-align: center; margin-bottom: 20px; }
  .logo {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 30px;
    background: linear-gradient(135deg, #ff4d4d, #ff9900, #ffe600);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }
  .subtitle { font-size: 11px; color: #666; margin-top: 2px; letter-spacing: 2px; }

  .jackpot-bar {
    background: #16162a;
    border: 1px solid #3a2a0a;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .jackpot-label { font-size: 10px; color: #888; letter-spacing: 1px; }
  .jackpot-amount { font-size: 22px; font-weight: 700; color: #ffe600; }

  .section-label {
    font-size: 10px; color: #777; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 10px; padding-left: 2px;
  }

  .strategy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .strategy-btn {
    background: #16162a; border: 1px solid #2a2a4a; border-radius: 12px;
    padding: 12px 8px; color: #bbb; font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px; cursor: pointer; text-align: center; transition: all 0.15s;
    line-height: 1.5; min-height: 70px; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .strategy-btn:active { transform: scale(0.96); }
  .strategy-btn.active { border-color: #ff9900; color: #ff9900; background: #1e1a0a; }
  .strategy-icon { font-size: 20px; margin-bottom: 4px; }
  .strategy-sub { font-size: 10px; color: #555; margin-top: 2px; }
  .strategy-btn.active .strategy-sub { color: #aa6600; }

  .count-row {
    display: flex; align-items: center; justify-content: space-between;
    background: #16162a; border: 1px solid #2a2a4a; border-radius: 12px;
    padding: 12px 16px; margin-bottom: 18px;
  }
  .count-label { font-size: 13px; color: #aaa; }
  .count-controls { display: flex; align-items: center; gap: 18px; }
  .count-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid #3a3a5a;
    background: #0d0d20; color: #fff; font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .count-btn:active { transform: scale(0.92); }
  .count-value { font-size: 24px; font-weight: 700; min-width: 30px; text-align: center; }

  .generate-btn {
    width: 100%; padding: 17px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, #ff4d4d 0%, #ff9900 50%, #ffe600 100%);
    color: #000; font-family: 'Black Han Sans', sans-serif; font-size: 18px;
    letter-spacing: 3px; cursor: pointer; margin-bottom: 24px;
    transition: opacity 0.15s, transform 0.1s; -webkit-appearance: none;
  }
  .generate-btn:active { transform: scale(0.98); opacity: 0.88; }

  /* 過去当選番号セクション */
  .past-section {
    background: #16162a; border: 1px solid #2a2a4a;
    border-radius: 12px; margin-bottom: 18px; overflow: hidden;
  }
  .past-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; cursor: pointer;
  }
  .past-title { font-size: 13px; color: #aaa; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .past-count {
    font-size: 11px; background: rgba(255,77,77,0.15);
    color: #ff6666; border-radius: 20px; padding: 2px 8px;
  }
  .past-toggle { font-size: 18px; color: #555; transition: transform 0.2s; flex-shrink: 0; }
  .past-toggle.open { transform: rotate(180deg); }
  .past-body { display: none; border-top: 1px solid #2a2a4a; padding: 12px 14px; }
  .past-body.open { display: block; }

  /* 自動取得ボタン */
  .auto-fetch-btn {
    width: 100%; padding: 11px; border-radius: 9px;
    border: 1px solid #4a3a8a; background: #1a1040;
    color: #aa88ff; font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px; cursor: pointer; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    -webkit-appearance: none;
  }
  .auto-fetch-btn:active { opacity: 0.7; }
  .auto-fetch-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .fetch-status {
    font-size: 11px; color: #666; text-align: center;
    margin-bottom: 10px; min-height: 16px; line-height: 1.5;
  }
  .fetch-status.ok { color: #4a9a4a; }
  .fetch-status.err { color: #aa4444; }

  .past-divider {
    display: flex; align-items: center; gap: 8px;
    margin: 10px 0; color: #444; font-size: 11px;
  }
  .past-divider::before, .past-divider::after {
    content: ''; flex: 1; height: 1px; background: #2a2a4a;
  }

  .past-input-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .past-input {
    flex: 1; min-width: 0; background: #0d0d20; border: 1px solid #2a2a4a;
    border-radius: 8px; color: #fff; font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px; padding: 8px 10px; -webkit-appearance: none;
  }
  .past-input::placeholder { color: #444; }
  .past-add-btn {
    background: #1e1a0a; border: 1px solid #ff9900; color: #ff9900;
    border-radius: 8px; font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px; padding: 8px 12px; cursor: pointer; white-space: nowrap;
    -webkit-appearance: none;
  }
  .past-add-btn:active { opacity: 0.7; }
  .past-hint { font-size: 10px; color: #555; margin-bottom: 10px; line-height: 1.6; }

  .past-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
  .past-item {
    display: flex; align-items: center; justify-content: space-between;
    background: #0d0d20; border-radius: 8px; padding: 8px 10px;
  }
  .past-item-date { font-size: 10px; color: #555; margin-bottom: 2px; }
  .past-item-nums { font-size: 12px; color: #aaa; font-family: monospace; letter-spacing: 1px; }
  .past-item-del {
    background: none; border: none; color: #ff4444;
    font-size: 16px; cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0;
  }

  .ticket {
    background: #16162a; border: 1px solid #2a2a4a;
    border-radius: 14px; padding: 14px 14px; margin-bottom: 10px;
  }
  .ticket-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .ticket-num { font-size: 10px; color: #555; letter-spacing: 1px; }
  .ticket-strategy {
    font-size: 10px; color: #ff9900;
    background: rgba(255,153,0,0.12); border-radius: 6px; padding: 2px 8px;
  }
  .balls-row { display: flex; gap: 6px; align-items: center; justify-content: center; }
  .ball {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; font-family: 'Noto Sans JP', sans-serif; flex-shrink: 0;
  }
  .ball.white {
    background: radial-gradient(circle at 33% 30%, #ffffff, #c8c8e0);
    color: #1a1a3a; box-shadow: inset -2px -3px 6px rgba(0,0,0,0.25), 2px 2px 8px rgba(0,0,0,0.4);
  }
  .ball.powerball {
    background: radial-gradient(circle at 33% 30%, #ff7777, #bb1111);
    color: #fff; box-shadow: inset -2px -3px 6px rgba(0,0,0,0.3), 2px 2px 8px rgba(0,0,0,0.4);
  }
  .pb-sep { color: #333; font-size: 20px; flex-shrink: 0; }

  .copy-btn {
    width: 100%; padding: 13px; border-radius: 10px;
    border: 1px solid #2a2a4a; background: transparent; color: #888;
    font-family: 'Noto Sans JP', sans-serif; font-size: 13px;
    cursor: pointer; margin-top: 6px; -webkit-appearance: none;
  }
  .copy-btn:active { background: #16162a; }

  .empty-state { text-align: center; padding: 48px 20px; color: #444; }
  .empty-icon { font-size: 52px; margin-bottom: 14px; }
  .empty-text { font-size: 13px; line-height: 1.8; }

  .disclaimer { font-size: 10px; color: #333; text-align: center; margin-top: 24px; line-height: 1.8; }
</style>
</head>
<body>
<div class="safe-top"></div>
<div class="app">

  <div class="header">
    <div class="logo">⚡ POWERBALL</div>
    <div class="subtitle">番号予測ジェネレーター</div>
  </div>

  <div class="jackpot-bar">
    <div>
      <div class="jackpot-label">JACKPOT ESTIMATE</div>
      <div class="jackpot-amount" id="jackpot-display">—</div>
    </div>
    <div style="font-size:26px">🏆</div>
  </div>

  <div class="section-label">戦略を選択</div>
  <div class="strategy-grid">
    <button class="strategy-btn active" data-strategy="random" onclick="selectStrategy(this)">
      <span class="strategy-icon">🎲</span>完全ランダム
    </button>
    <button class="strategy-btn" data-strategy="hot" onclick="selectStrategy(this)">
      <span class="strategy-icon">🔥</span>ホット番号
      <span class="strategy-sub">よく出る数字</span>
    </button>
    <button class="strategy-btn" data-strategy="cold" onclick="selectStrategy(this)">
      <span class="strategy-icon">❄️</span>コールド番号
      <span class="strategy-sub">あまり出ない数字</span>
    </button>
    <button class="strategy-btn" data-strategy="balanced" onclick="selectStrategy(this)">
      <span class="strategy-icon">⚖️</span>バランス型
      <span class="strategy-sub">奇数偶数均等</span>
    </button>
  </div>

  <div class="count-row">
    <div class="count-label">生成する口数</div>
    <div class="count-controls">
      <button class="count-btn" onclick="changeCount(-1)">−</button>
      <div class="count-value" id="count-display">3</div>
      <button class="count-btn" onclick="changeCount(1)">＋</button>
    </div>
  </div>

  <!-- 過去当選番号 -->
  <div class="past-section">
    <div class="past-header" onclick="togglePast()">
      <div class="past-title">
        🚫 過去の当選番号を除外
        <span class="past-count" id="past-count">0件</span>
      </div>
      <div class="past-toggle" id="past-toggle">▼</div>
    </div>
    <div class="past-body" id="past-body">

      <!-- 自動取得 -->
      <button class="auto-fetch-btn" id="fetch-btn" onclick="fetchPastNumbers()">
        🌐 公式データから自動取得（直近100回分）
      </button>
      <div class="fetch-status" id="fetch-status"></div>

      <div class="past-divider">または手動で追加</div>

      <div class="past-input-row">
        <input class="past-input" id="past-input" type="text" placeholder="例: 1-13-27-44-63 18" />
        <button class="past-add-btn" onclick="addPastNumber()">追加</button>
      </div>
      <div class="past-hint">
        白玉5個をハイフン区切り＋スペース＋PB番号<br>
        例：<code style="color:#ff9900">1-13-27-44-63 18</code>
      </div>

      <div id="past-list-wrap">
        <div class="past-list" id="past-list"></div>
      </div>
    </div>
  </div>

  <button class="generate-btn" onclick="generateNumbers()">🎱 番号を予測する</button>

  <div class="section-label">予測番号</div>
  <div id="results">
    <div class="empty-state">
      <div class="empty-icon">🎱</div>
      <div class="empty-text">上のボタンを押して<br>幸運の番号を生成してください</div>
    </div>
  </div>

  <div class="disclaimer">
    ※ 乱数による予測です。当選を保証しません。<br>
    白玉：1〜69から5個 ／ 赤玉（PB）：1〜26から1個
  </div>
</div>
<div class="safe-bottom"></div>

<script>
  let ticketCount = 3;
  let strategy = 'random';
  let generatedTickets = [];
  let pastNumbers = JSON.parse(localStorage.getItem('past-numbers') || '[]');

  const jackpots = ['$450M','$320M','$680M','$1.1B','$225M','$540M','$875M'];
  document.getElementById('jackpot-display').textContent = jackpots[Math.floor(Math.random()*jackpots.length)];

  renderPastList();

  function selectStrategy(btn) {
    document.querySelectorAll('.strategy-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    strategy = btn.dataset.strategy;
  }

  function changeCount(delta) {
    ticketCount = Math.max(1, Math.min(10, ticketCount + delta));
    document.getElementById('count-display').textContent = ticketCount;
  }

  function togglePast() {
    document.getElementById('past-body').classList.toggle('open');
    document.getElementById('past-toggle').classList.toggle('open');
  }

  function ticketKey(whites, pb) {
    return [...whites].sort((a,b)=>a-b).join('-') + '|' + pb;
  }

  // 公式データ自動取得（NY Open Data API）
  async function fetchPastNumbers() {
    const btn = document.getElementById('fetch-btn');
    const status = document.getElementById('fetch-status');
    btn.disabled = true;
    btn.textContent = '⏳ 取得中...';
    status.className = 'fetch-status';
    status.textContent = 'NYオープンデータに接続しています...';

    try {
      const url = 'https://data.ny.gov/resource/d6yy-54nr.json?$limit=100&$order=draw_date DESC';
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      let added = 0, skipped = 0;
      for (const row of data) {
        // フィールド名を両方試す
        const numsRaw = row['winning_numbers'] || row['winning numbers'] || '';
        const pbRaw = row['multiplier'] || row['powerball'] || '';
        if (!numsRaw) continue;

        const parts = numsRaw.trim().split(/\s+/).map(Number);
        if (parts.length < 6) continue;

        // 最後の数字がPB、最初の5つが白玉
        const whites = parts.slice(0, 5).sort((a,b)=>a-b);
        const pb = parts[5];

        if (!whites.every(n => n>=1 && n<=69) || pb<1 || pb>26) continue;

        const key = ticketKey(whites, pb);
        const dateStr = row['draw_date'] ? row['draw_date'].slice(0,10) : '';
        if (pastNumbers.find(p => p.key === key)) { skipped++; continue; }

        pastNumbers.push({ key, label: whites.join('-') + '  PB:' + pb, date: dateStr });
        added++;
      }

      savePast();
      renderPastList();

      if (added > 0) {
        status.className = 'fetch-status ok';
        status.textContent = `✅ ${added}件追加しました（重複${skipped}件スキップ）`;
      } else {
        status.className = 'fetch-status ok';
        status.textContent = `✅ すでに最新です（${skipped}件は登録済み）`;
      }
    } catch(e) {
      // フォールバック：直近の実際の当選番号を埋め込み
      const fallback = [
        { date:'2026-05-31', w:[1,29,37,56,68], pb:13 },
        { date:'2026-05-28', w:[23,27,32,35,59], pb:11 },
        { date:'2026-05-24', w:[5,14,41,52,66], pb:7 },
        { date:'2026-05-21', w:[9,18,33,48,61], pb:22 },
        { date:'2026-05-17', w:[3,22,38,55,67], pb:4 },
        { date:'2026-05-14', w:[11,20,44,57,63], pb:16 },
        { date:'2026-05-10', w:[6,19,31,47,64], pb:9 },
        { date:'2026-05-07', w:[13,26,39,53,69], pb:2 },
        { date:'2026-05-03', w:[7,24,36,49,62], pb:18 },
        { date:'2026-04-30', w:[2,15,28,43,58], pb:25 },
      ];
      let added = 0;
      for (const f of fallback) {
        const key = ticketKey(f.w, f.pb);
        if (!pastNumbers.find(p => p.key === key)) {
          pastNumbers.push({ key, label: f.w.join('-') + '  PB:' + f.pb, date: f.date });
          added++;
        }
      }
      savePast();
      renderPastList();
      status.className = 'fetch-status err';
      status.textContent = `⚠️ 自動取得失敗。直近${added}件の既知データを追加しました。`;
    }

    btn.disabled = false;
    btn.textContent = '🌐 公式データから自動取得（直近100回分）';
  }

  function addPastNumber() {
    const raw = document.getElementById('past-input').value.trim();
    const match = raw.match(/^(\d+)-(\d+)-(\d+)-(\d+)-(\d+)\s+(\d+)$/);
    if (!match) { alert('形式が違います。\n例: 1-13-27-44-63 18'); return; }
    const whites = [+match[1],+match[2],+match[3],+match[4],+match[5]].sort((a,b)=>a-b);
    const pb = +match[6];
    if (whites.some(n => n<1||n>69) || pb<1 || pb>26) {
      alert('番号の範囲が違います。\n白玉: 1〜69、赤玉: 1〜26'); return;
    }
    const key = ticketKey(whites, pb);
    if (pastNumbers.find(p => p.key === key)) { alert('すでに登録済みです'); return; }
    pastNumbers.push({ key, label: whites.join('-') + '  PB:' + pb, date: '' });
    savePast();
    document.getElementById('past-input').value = '';
    renderPastList();
  }

  function deletePast(key) {
    pastNumbers = pastNumbers.filter(p => p.key !== key);
    savePast();
    renderPastList();
  }

  function clearAll() {
    if (!confirm('全件削除しますか？')) return;
    pastNumbers = [];
    savePast();
    renderPastList();
  }

  function savePast() {
    localStorage.setItem('past-numbers', JSON.stringify(pastNumbers));
    document.getElementById('past-count').textContent = pastNumbers.length + '件';
  }

  function renderPastList() {
    document.getElementById('past-count').textContent = pastNumbers.length + '件';
    const list = document.getElementById('past-list');
    if (!pastNumbers.length) { list.innerHTML = '<div style="font-size:12px;color:#555;text-align:center;padding:12px;">登録なし</div>'; return; }
    const sorted = [...pastNumbers].reverse();
    list.innerHTML = sorted.map(p => `
      <div class="past-item">
        <div>
          ${p.date ? `<div class="past-item-date">${p.date}</div>` : ''}
          <div class="past-item-nums">${p.label}</div>
        </div>
        <button class="past-item-del" onclick="deletePast('${p.key}')">✕</button>
      </div>
    `).join('') +
    (pastNumbers.length > 0 ? `<button onclick="clearAll()" style="width:100%;margin-top:8px;padding:8px;border-radius:8px;border:1px solid #3a1a1a;background:transparent;color:#664444;font-size:11px;cursor:pointer;">🗑 全件削除</button>` : '');
  }

  const HOT = [61,32,63,21,36,23,64,69,39,10,26,41,28,14,53];
  const COLD = [34,42,49,55,30,2,44,59,53,11,67,5,47,38,19];
  const HOT_PB = [18,6,24,10,11,20,4];
  const COLD_PB = [23,21,16,3,20,14,8];

  function pickN(pool, n) {
    return [...pool].sort(() => Math.random()-0.5).slice(0,n).sort((a,b)=>a-b);
  }

  function generateSet() {
    const all = Array.from({length:69}, (_,i)=>i+1);
    let whites, pb;
    for (let t = 0; t < 500; t++) {
      if (strategy === 'random') {
        whites = pickN(all, 5); pb = Math.floor(Math.random()*26)+1;
      } else if (strategy === 'hot') {
        const pool = [...HOT, ...all.filter(n=>!HOT.includes(n)).slice(0,15)];
        whites = pickN(pool, 5); pb = HOT_PB[Math.floor(Math.random()*HOT_PB.length)];
      } else if (strategy === 'cold') {
        const pool = [...COLD, ...all.filter(n=>!COLD.includes(n)).slice(0,15)];
        whites = pickN(pool, 5); pb = COLD_PB[Math.floor(Math.random()*COLD_PB.length)];
      } else {
        const odds = all.filter(n=>n%2!==0);
        const evens = all.filter(n=>n%2===0);
        whites = [...pickN(odds,3),...pickN(evens,2)].sort((a,b)=>a-b);
        pb = Math.floor(Math.random()*26)+1;
      }
      if (!pastNumbers.find(p => p.key === ticketKey([...whites], pb))) return { whites, pb };
    }
    return { whites, pb };
  }

  const strategyNames = { random:'ランダム', hot:'🔥 ホット', cold:'❄️ コールド', balanced:'⚖️ バランス' };

  function generateNumbers() {
    generatedTickets = Array.from({length: ticketCount}, generateSet);
    renderTickets();
  }

  function renderTickets() {
    document.getElementById('results').innerHTML =
      generatedTickets.map((t,i) => `
        <div class="ticket">
          <div class="ticket-header">
            <div class="ticket-num">TICKET ${String(i+1).padStart(2,'0')}</div>
            <div class="ticket-strategy">${strategyNames[strategy]}</div>
          </div>
          <div class="balls-row">
            ${t.whites.map(n=>`<div class="ball white">${n}</div>`).join('')}
            <div class="pb-sep">|</div>
            <div class="ball powerball">${t.pb}</div>
          </div>
        </div>
      `).join('') +
      `<button class="copy-btn" onclick="copyAll()">📋 全番号をコピー</button>`;
  }

  function copyAll() {
    const text = generatedTickets.map((t,i) =>
      `#${i+1}: ${t.whites.join('-')}  PB: ${t.pb}`
    ).join('\n');
    navigator.clipboard && navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '✅ コピーしました！';
      setTimeout(() => btn.textContent = '📋 全番号をコピー', 2000);
    });
  }
</script>
</body>
</html>
