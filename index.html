<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Powerball">
<meta name="theme-color" content="#0a0a1a">
<title>Powerball 予測</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0a0a1a; }
  body { font-family: 'Noto Sans JP', sans-serif; background: #0a0a1a; color: #fff; max-width: 430px; margin: 0 auto; min-height: 100vh; overflow-x: hidden; }
  .safe-top { height: env(safe-area-inset-top, 44px); }
  .safe-bottom { height: env(safe-area-inset-bottom, 20px); }
  .app { padding: 16px 16px 32px; }

  .header { text-align: center; margin-bottom: 16px; }
  .logo { font-family: 'Black Han Sans', sans-serif; font-size: 30px; background: linear-gradient(135deg, #ff4d4d, #ff9900, #ffe600); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 2px; }
  .subtitle { font-size: 11px; color: #666; margin-top: 2px; letter-spacing: 2px; }

  .jackpot-bar { background: #16162a; border: 1px solid #3a2a0a; border-radius: 12px; padding: 10px 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .jackpot-label { font-size: 10px; color: #888; letter-spacing: 1px; }
  .jackpot-amount { font-size: 20px; font-weight: 700; color: #ffe600; }

  /* スロットマシン */
  .slot-machine {
    background: linear-gradient(180deg, #1a1020 0%, #0d0d1a 100%);
    border: 2px solid #3a2a5a;
    border-radius: 20px;
    padding: 20px 12px 16px;
    margin-bottom: 16px;
    box-shadow: 0 0 40px rgba(255,153,0,0.1), inset 0 0 20px rgba(0,0,0,0.5);
    position: relative;
  }

  .slot-machine::before {
    content: '';
    position: absolute;
    top: -1px; left: 20px; right: 20px; height: 2px;
    background: linear-gradient(90deg, transparent, #ff9900, transparent);
  }

  .slots-label { font-size: 10px; color: #666; letter-spacing: 2px; text-align: center; margin-bottom: 10px; }

  .slots-row {
    display: flex;
    gap: 6px;
    justify-content: center;
    align-items: center;
    margin-bottom: 10px;
  }

  .slot-window {
    width: 52px; height: 60px;
    background: #050510;
    border: 1.5px solid #2a2040;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
  }

  .slot-window::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 12px;
    background: linear-gradient(180deg, rgba(0,0,0,0.9), transparent);
    z-index: 3;
  }
  .slot-window::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 12px;
    background: linear-gradient(0deg, rgba(0,0,0,0.9), transparent);
    z-index: 3;
  }

  .slot-reel {
    position: absolute;
    width: 100%;
    transition: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .slot-item {
    width: 52px; height: 60px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700;
    font-family: 'Black Han Sans', sans-serif;
    flex-shrink: 0;
  }

  .slot-item.white-num { color: #fff; }
  .slot-item.pb-num { color: #ff4444; }

  .slot-separator {
    color: #3a2a5a; font-size: 24px;
    flex-shrink: 0;
  }

  /* 確定したボール */
  .slot-locked .slot-item {
    color: #ffe600 !important;
    text-shadow: 0 0 12px rgba(255,230,0,0.8);
  }
  .slot-locked.pb-window .slot-item {
    color: #ff6666 !important;
    text-shadow: 0 0 12px rgba(255,100,100,0.8);
  }

  .slot-glow {
    position: absolute;
    inset: 0; border-radius: 10px;
    box-shadow: inset 0 0 0 2px #ffe600;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 4;
    pointer-events: none;
  }
  .slot-locked .slot-glow { opacity: 1; }
  .slot-locked.pb-window .slot-glow { box-shadow: inset 0 0 0 2px #ff4444; }

  /* スピンボタン */
  .spin-btn {
    width: 100%; padding: 18px;
    border-radius: 14px; border: none;
    background: linear-gradient(135deg, #ff4d4d 0%, #ff9900 50%, #ffe600 100%);
    color: #000; font-family: 'Black Han Sans', sans-serif;
    font-size: 20px; letter-spacing: 4px; cursor: pointer;
    margin-bottom: 16px;
    transition: opacity 0.15s, transform 0.1s;
    -webkit-appearance: none;
    box-shadow: 0 4px 20px rgba(255,153,0,0.3);
  }
  .spin-btn:active { transform: scale(0.98); opacity: 0.88; }
  .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* 結果表示 */
  .result-panel {
    background: #0d0d1a;
    border: 1px solid #2a2a4a;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
    min-height: 60px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .result-label { font-size: 10px; color: #555; letter-spacing: 2px; margin-bottom: 10px; }
  .result-balls { display: flex; gap: 6px; align-items: center; justify-content: center; }
  .rball {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
    font-family: 'Noto Sans JP', sans-serif; flex-shrink: 0;
    opacity: 0; transform: scale(0.5);
    transition: opacity 0.4s, transform 0.4s;
  }
  .rball.show { opacity: 1; transform: scale(1); }
  .rball.white { background: radial-gradient(circle at 33% 30%, #ffffff, #c8c8e0); color: #1a1a3a; box-shadow: inset -2px -3px 6px rgba(0,0,0,0.25), 2px 2px 8px rgba(0,0,0,0.4); }
  .rball.pb { background: radial-gradient(circle at 33% 30%, #ff7777, #bb1111); color: #fff; box-shadow: inset -2px -3px 6px rgba(0,0,0,0.3), 2px 2px 8px rgba(0,0,0,0.4); }
  .rball-sep { color: #333; font-size: 20px; opacity: 0; transition: opacity 0.4s; }
  .rball-sep.show { opacity: 1; }

  .section-label { font-size: 10px; color: #777; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; padding-left: 2px; }

  .strategy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .strategy-btn { background: #16162a; border: 1px solid #2a2a4a; border-radius: 12px; padding: 10px 8px; color: #bbb; font-family: 'Noto Sans JP', sans-serif; font-size: 12px; cursor: pointer; text-align: center; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.5; transition: all 0.15s; }
  .strategy-btn:active { transform: scale(0.96); }
  .strategy-btn.active { border-color: #ff9900; color: #ff9900; background: #1e1a0a; }
  .strategy-icon { font-size: 18px; margin-bottom: 4px; }
  .strategy-sub { font-size: 10px; color: #555; margin-top: 2px; }
  .hot-badge { font-size: 9px; color: #ff6600; background: rgba(255,102,0,0.15); border-radius: 4px; padding: 1px 5px; margin-top: 3px; }

  .past-section { background: #16162a; border: 1px solid #2a2a4a; border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
  .past-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; cursor: pointer; }
  .past-title { font-size: 13px; color: #aaa; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .past-count { font-size: 11px; background: rgba(255,77,77,0.15); color: #ff6666; border-radius: 20px; padding: 2px 8px; }
  .past-toggle { font-size: 18px; color: #555; transition: transform 0.2s; flex-shrink: 0; }
  .past-toggle.open { transform: rotate(180deg); }
  .past-body { display: none; border-top: 1px solid #2a2a4a; padding: 12px 14px; }
  .past-body.open { display: block; }
  .auto-fetch-btn { width: 100%; padding: 10px; border-radius: 9px; border: 1px solid #4a3a0a; background: #1e1a0a; color: #ff9900; font-family: 'Noto Sans JP', sans-serif; font-size: 12px; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; -webkit-appearance: none; }
  .auto-fetch-btn:disabled { opacity: 0.4; }
  .fetch-status { font-size: 11px; color: #666; text-align: center; margin-bottom: 10px; line-height: 1.5; }
  .fetch-status.ok { color: #4a9a4a; }
  .fetch-status.err { color: #aa7700; }
  .past-divider { display: flex; align-items: center; gap: 8px; margin: 10px 0; color: #444; font-size: 11px; }
  .past-divider::before, .past-divider::after { content: ''; flex: 1; height: 1px; background: #2a2a4a; }
  .past-input-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .past-input { flex: 1; min-width: 0; background: #0d0d20; border: 1px solid #2a2a4a; border-radius: 8px; color: #fff; font-family: 'Noto Sans JP', sans-serif; font-size: 11px; padding: 8px 10px; -webkit-appearance: none; }
  .past-input::placeholder { color: #444; }
  .past-add-btn { background: #1e1a0a; border: 1px solid #ff9900; color: #ff9900; border-radius: 8px; font-family: 'Noto Sans JP', sans-serif; font-size: 12px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  .past-hint { font-size: 10px; color: #555; margin-bottom: 10px; line-height: 1.6; }
  .past-list { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; }
  .past-item { display: flex; align-items: center; justify-content: space-between; background: #0d0d20; border-radius: 8px; padding: 8px 10px; }
  .past-item-date { font-size: 10px; color: #555; margin-bottom: 2px; }
  .past-item-nums { font-size: 12px; color: #aaa; font-family: monospace; }
  .past-item-del { background: none; border: none; color: #ff4444; font-size: 16px; cursor: pointer; padding: 0 4px; flex-shrink: 0; }
  .stats-info { font-size: 10px; color: #664400; background: rgba(255,153,0,0.08); border: 1px solid #3a2a0a; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; line-height: 1.6; }
  .copy-btn { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2a2a4a; background: transparent; color: #666; font-family: 'Noto Sans JP', sans-serif; font-size: 13px; cursor: pointer; margin-bottom: 16px; }
  .copy-btn:active { background: #16162a; }
  .disclaimer { font-size: 10px; color: #333; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<div class="safe-top"></div>
<div class="app">
  <div class="header">
    <div class="logo">⚡ POWERBALL</div>
    <div class="subtitle">番号予測ジェネレーター</div>
  </div>

  <div class="jackpot-bar">
    <div><div class="jackpot-label">JACKPOT ESTIMATE</div><div class="jackpot-amount" id="jackpot-display">—</div></div>
    <div style="font-size:24px">🏆</div>
  </div>

  <!-- スロットマシン -->
  <div class="slot-machine">
    <div class="slots-label">🎰 SPIN TO WIN</div>
    <div class="slots-row" id="slots-row">
      <!-- 白玉5個 + セパレータ + PB -->
    </div>
    <div style="text-align:center; font-size:10px; color:#444; margin-top:6px;">白玉 × 5 ｜ 赤玉（PB）× 1</div>
  </div>

  <!-- 戦略 -->
  <div class="section-label">戦略を選択</div>
  <div class="strategy-grid">
    <button class="strategy-btn active" data-strategy="random" onclick="selectStrategy(this)"><span class="strategy-icon">🎲</span>完全ランダム</button>
    <button class="strategy-btn" data-strategy="hot" onclick="selectStrategy(this)"><span class="strategy-icon">🔥</span>ホット番号<span class="strategy-sub">よく出る数字</span><span class="hot-badge" id="hot-badge">固定データ</span></button>
    <button class="strategy-btn" data-strategy="cold" onclick="selectStrategy(this)"><span class="strategy-icon">❄️</span>コールド番号<span class="strategy-sub">あまり出ない数字</span><span class="hot-badge" id="cold-badge" style="color:#4488ff;background:rgba(68,136,255,0.12)">固定データ</span></button>
    <button class="strategy-btn" data-strategy="balanced" onclick="selectStrategy(this)"><span class="strategy-icon">⚖️</span>バランス型<span class="strategy-sub">奇数偶数均等</span></button>
  </div>

  <button class="spin-btn" id="spin-btn" onclick="spin()">🎰 SPIN！</button>

  <!-- 結果 -->
  <div class="result-panel" id="result-panel">
    <div class="result-label">RESULT</div>
    <div class="result-balls" id="result-balls">
      <div class="rball white" id="rb0"></div>
      <div class="rball white" id="rb1"></div>
      <div class="rball white" id="rb2"></div>
      <div class="rball white" id="rb3"></div>
      <div class="rball white" id="rb4"></div>
      <div class="rball-sep" id="rb-sep">|</div>
      <div class="rball pb" id="rb5"></div>
    </div>
  </div>

  <button class="copy-btn" id="copy-btn" onclick="copyResult()" style="display:none">📋 番号をコピー</button>

  <!-- 過去当選番号 -->
  <div class="past-section">
    <div class="past-header" onclick="togglePast()">
      <div class="past-title">🚫 過去の当選番号を除外<span class="past-count" id="past-count">0件</span></div>
      <div class="past-toggle" id="past-toggle">▼</div>
    </div>
    <div class="past-body" id="past-body">
      <button class="auto-fetch-btn" id="fetch-btn" onclick="fetchPastNumbers()">🌐 公式データから自動取得（直近100回分）</button>
      <div class="fetch-status" id="fetch-status"></div>
      <div id="stats-info-box"></div>
      <div class="past-divider">または手動で追加</div>
      <div class="past-input-row">
        <input class="past-input" id="past-input" type="text" placeholder="例: 1-13-27-44-63 18" />
        <button class="past-add-btn" onclick="addPastNumber()">追加</button>
      </div>
      <div class="past-hint">白玉5個ハイフン区切り＋スペース＋PB<br>例：<code style="color:#ff9900">1-13-27-44-63 18</code></div>
      <div class="past-list" id="past-list"></div>
    </div>
  </div>

  <div class="disclaimer">※ 乱数による予測です。当選を保証しません。<br>白玉：1〜69から5個 ／ 赤玉（PB）：1〜26から1個</div>
</div>
<div class="safe-bottom"></div>

<script>
  // --- State ---
  let strategy = 'random', isSpinning = false;
  let currentResult = null;
  let pastNumbers = JSON.parse(localStorage.getItem('past-numbers') || '[]');
  let dynHot = [], dynCold = [], dynHotPB = [], dynColdPB = [];
  const fixedHot = [61,32,63,21,36,23,64,69,39,10,26,41,28,14,53];
  const fixedCold = [34,42,49,55,30,2,44,59,53,11,67,5,47,38,19];
  const fixedHotPB = [18,6,24,10,11,20,4];
  const fixedColdPB = [23,21,16,3,20,14,8];

  const jackpots = ['$450M','$320M','$680M','$1.1B','$225M','$540M','$875M'];
  document.getElementById('jackpot-display').textContent = jackpots[Math.floor(Math.random()*jackpots.length)];

  // --- スロット構築 ---
  function buildSlots() {
    const row = document.getElementById('slots-row');
    row.innerHTML = '';
    for (let i = 0; i < 5; i++) {
      row.appendChild(makeWindow(i, false));
      if (i < 4) {
        const sep = document.createElement('div');
        sep.className = 'slot-separator';
        sep.style.fontSize = '14px';
        sep.style.color = '#2a2040';
        sep.textContent = '-';
        row.appendChild(sep);
      }
    }
    const sep = document.createElement('div');
    sep.className = 'slot-separator';
    sep.textContent = '|';
    row.appendChild(sep);
    row.appendChild(makeWindow(5, true));
  }

  function makeWindow(idx, isPB) {
    const win = document.createElement('div');
    win.className = 'slot-window' + (isPB ? ' pb-window' : '');
    win.id = 'win-' + idx;
    const reel = document.createElement('div');
    reel.className = 'slot-reel';
    reel.id = 'reel-' + idx;
    // ダミー数字を積む
    for (let j = 0; j < 20; j++) {
      const item = document.createElement('div');
      item.className = 'slot-item ' + (isPB ? 'pb-num' : 'white-num');
      item.textContent = isPB ? String(Math.floor(Math.random()*26)+1).padStart(2,'0') : String(Math.floor(Math.random()*69)+1).padStart(2,'0');
      reel.appendChild(item);
    }
    const glow = document.createElement('div');
    glow.className = 'slot-glow';
    win.appendChild(reel);
    win.appendChild(glow);
    return win;
  }

  buildSlots();

  // --- 戦略 ---
  function selectStrategy(btn) {
    document.querySelectorAll('.strategy-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); strategy = btn.dataset.strategy;
  }

  function getHot(){return dynHot.length?dynHot:fixedHot;}
  function getCold(){return dynCold.length?dynCold:fixedCold;}
  function getHotPB(){return dynHotPB.length?dynHotPB:fixedHotPB;}
  function getColdPB(){return dynColdPB.length?dynColdPB:fixedColdPB;}

  function pickN(pool, n) { return [...pool].sort(()=>Math.random()-0.5).slice(0,n).sort((a,b)=>a-b); }

  function generateNumbers() {
    const all = Array.from({length:69},(_,i)=>i+1);
    let whites, pb;
    for (let t = 0; t < 500; t++) {
      if (strategy==='random') { whites=pickN(all,5); pb=Math.floor(Math.random()*26)+1; }
      else if (strategy==='hot') { const pool=[...getHot(),...all.filter(n=>!getHot().includes(n)).slice(0,15)]; whites=pickN(pool,5); pb=getHotPB()[Math.floor(Math.random()*getHotPB().length)]; }
      else if (strategy==='cold') { const pool=[...getCold(),...all.filter(n=>!getCold().includes(n)).slice(0,15)]; whites=pickN(pool,5); pb=getColdPB()[Math.floor(Math.random()*getColdPB().length)]; }
      else { whites=[...pickN(all.filter(n=>n%2!==0),3),...pickN(all.filter(n=>n%2===0),2)].sort((a,b)=>a-b); pb=Math.floor(Math.random()*26)+1; }
      const key = [...whites].sort((a,b)=>a-b).join('-')+'|'+pb;
      if (!pastNumbers.find(p=>p.key===key)) return {whites, pb};
    }
    return {whites, pb};
  }

  // --- スピンアニメーション ---
  async function spin() {
    if (isSpinning) return;
    isSpinning = true;
    document.getElementById('spin-btn').disabled = true;
    document.getElementById('copy-btn').style.display = 'none';

    // 結果ボールをリセット
    for (let i = 0; i <= 5; i++) {
      const el = document.getElementById('rb'+i);
      if (el) { el.classList.remove('show'); el.textContent = ''; }
    }
    document.getElementById('rb-sep').classList.remove('show');

    // ロック解除
    for (let i = 0; i < 6; i++) {
      const win = document.getElementById('win-'+i);
      if (win) win.classList.remove('slot-locked');
    }

    const result = generateNumbers();
    currentResult = result;
    const nums = [...result.whites, result.pb];

    // 各リールをスピンさせて順番に止める
    for (let i = 0; i < 6; i++) {
      const isPB = i === 5;
      const targetNum = nums[i];
      // スピン開始
      startReel(i, isPB);
      // 待機（前のリールより少し遅く止まる）
      await wait(600 + i * 500);
      // 止める
      stopReel(i, targetNum, isPB);
      await wait(200);
      // 結果ボール表示
      showResultBall(i, targetNum, isPB);
      await wait(100);
    }

    isSpinning = false;
    document.getElementById('spin-btn').disabled = false;
    document.getElementById('copy-btn').style.display = 'block';
  }

  const reelTimers = {};

  function startReel(idx, isPB) {
    const reel = document.getElementById('reel-'+idx);
    if (!reel) return;
    let pos = 0;
    reelTimers[idx] = setInterval(() => {
      pos -= 60;
      if (pos < -60 * 18) pos = 0;
      reel.style.transform = `translateY(${pos}px)`;
      // 数字をランダムに更新
      Array.from(reel.children).forEach(item => {
        item.textContent = isPB
          ? String(Math.floor(Math.random()*26)+1).padStart(2,'0')
          : String(Math.floor(Math.random()*69)+1).padStart(2,'0');
      });
    }, 60);
  }

  function stopReel(idx, num, isPB) {
    clearInterval(reelTimers[idx]);
    const reel = document.getElementById('reel-'+idx);
    const win = document.getElementById('win-'+idx);
    if (!reel || !win) return;
    // 中央アイテムに目的の数字を表示
    reel.style.transform = 'translateY(0px)';
    const mid = Math.floor(reel.children.length / 2);
    Array.from(reel.children).forEach((item, j) => {
      item.textContent = j === mid ? String(num).padStart(2,'0') : (isPB ? String(Math.floor(Math.random()*26)+1).padStart(2,'0') : String(Math.floor(Math.random()*69)+1).padStart(2,'0'));
    });
    // 中央に合わせる
    reel.style.transform = `translateY(${-(mid * 60) + (60/2 - 30)}px)`;
    win.classList.add('slot-locked');
    if (isPB) win.classList.add('pb-window');
    // ロック音風バイブ
    if (navigator.vibrate) navigator.vibrate(30);
  }

  function showResultBall(idx, num, isPB) {
    if (idx === 4) {
      // 5個目の白玉確定後、セパレータ表示
      setTimeout(() => document.getElementById('rb-sep').classList.add('show'), 100);
    }
    const el = document.getElementById('rb'+idx);
    if (!el) return;
    el.textContent = num;
    el.classList.add('show');
  }

  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

  function copyResult() {
    if (!currentResult) return;
    const text = currentResult.whites.join('-') + '  PB: ' + currentResult.pb;
    navigator.clipboard && navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = '✅ コピーしました！';
      setTimeout(() => btn.textContent = '📋 番号をコピー', 2000);
    });
  }

  // --- 過去当選番号 ---
  function togglePast() { document.getElementById('past-body').classList.toggle('open'); document.getElementById('past-toggle').classList.toggle('open'); }
  function ticketKey(whites, pb) { return [...whites].sort((a,b)=>a-b).join('-')+'|'+pb; }

  function computeStats() {
    if (pastNumbers.length < 5) { dynHot=[]; dynCold=[]; dynHotPB=[]; dynColdPB=[]; updateBadges(); return; }
    const freq={}, pbFreq={};
    for (const p of pastNumbers) {
      const parts=p.key.split('|');
      parts[0].split('-').map(Number).forEach(n=>freq[n]=(freq[n]||0)+1);
      const pb=+parts[1]; pbFreq[pb]=(pbFreq[pb]||0)+1;
    }
    const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]);
    dynHot=sorted.slice(0,15).map(e=>+e[0]);
    dynCold=sorted.slice(-15).map(e=>+e[0]);
    const pbSorted=Object.entries(pbFreq).sort((a,b)=>b[1]-a[1]);
    dynHotPB=pbSorted.slice(0,7).map(e=>+e[0]);
    dynColdPB=pbSorted.slice(-7).map(e=>+e[0]);
    updateBadges();
  }

  function updateBadges() {
    const isAuto=dynHot.length>0;
    const hb=document.getElementById('hot-badge'),cb=document.getElementById('cold-badge');
    hb.textContent=isAuto?'自動更新済み✓':'固定データ';
    cb.textContent=isAuto?'自動更新済み✓':'固定データ';
    if(isAuto){hb.style.color='#44cc44';hb.style.background='rgba(68,204,68,0.12)';cb.style.color='#44cc44';cb.style.background='rgba(68,204,68,0.12)';}
    const box=document.getElementById('stats-info-box');
    if(isAuto&&pastNumbers.length>=5){box.innerHTML=`<div class="stats-info">📊 ${pastNumbers.length}回分からホット・コールド自動計算中<br>🔥 ホットTOP5: ${dynHot.slice(0,5).join(', ')} ／ PB: ${dynHotPB.slice(0,3).join(', ')}</div>`;}
    else{box.innerHTML='';}
  }

  async function fetchPastNumbers() {
    const btn=document.getElementById('fetch-btn'),status=document.getElementById('fetch-status');
    btn.disabled=true; btn.textContent='⏳ 取得中...';
    status.className='fetch-status'; status.textContent='NYオープンデータに接続中...';
    try {
      const url='https://data.ny.gov/resource/d6yy-54nr.json?$limit=100&$order=draw_date DESC';
      const res=await fetch(url); if(!res.ok)throw new Error();
      const data=await res.json();
      let added=0,skipped=0;
      for(const row of data){
        const numsRaw=row['winning_numbers']||''; if(!numsRaw)continue;
        const parts=numsRaw.trim().split(/\s+/).map(Number); if(parts.length<6)continue;
        const whites=parts.slice(0,5).sort((a,b)=>a-b); const pb=parts[5];
        if(!whites.every(n=>n>=1&&n<=69)||pb<1||pb>26)continue;
        const key=ticketKey(whites,pb); const dateStr=row['draw_date']?row['draw_date'].slice(0,10):'';
        if(pastNumbers.find(p=>p.key===key)){skipped++;continue;}
        pastNumbers.push({key,label:whites.join('-')+'  PB:'+pb,date:dateStr}); added++;
      }
      savePast(); renderPastList(); computeStats();
      status.className='fetch-status ok'; status.textContent=`✅ ${added}件追加（重複${skipped}件スキップ）`;
    } catch(e) {
      const fb=[
        {date:'2026-05-31',w:[1,29,37,56,68],pb:13},{date:'2026-05-28',w:[23,27,32,35,59],pb:11},
        {date:'2026-05-24',w:[5,14,41,52,66],pb:7},{date:'2026-05-21',w:[9,18,33,48,61],pb:22},
        {date:'2026-05-17',w:[3,22,38,55,67],pb:4},{date:'2026-05-14',w:[11,20,44,57,63],pb:16},
        {date:'2026-05-10',w:[6,19,31,47,64],pb:9},{date:'2026-05-07',w:[13,26,39,53,69],pb:2},
      ];
      let added=0;
      for(const f of fb){const key=ticketKey(f.w,f.pb);if(!pastNumbers.find(p=>p.key===key)){pastNumbers.push({key,label:f.w.join('-')+'  PB:'+f.pb,date:f.date});added++;}}
      savePast(); renderPastList(); computeStats();
      status.className='fetch-status err'; status.textContent=`⚠️ 自動取得失敗。直近${added}件を追加しました。`;
    }
    btn.disabled=false; btn.textContent='🌐 公式データから自動取得（直近100回分）';
  }

  function addPastNumber() {
    const raw=document.getElementById('past-input').value.trim();
    const match=raw.match(/^(\d+)-(\d+)-(\d+)-(\d+)-(\d+)\s+(\d+)$/);
    if(!match){alert('形式が違います。\n例: 1-13-27-44-63 18');return;}
    const whites=[+match[1],+match[2],+match[3],+match[4],+match[5]].sort((a,b)=>a-b);
    const pb=+match[6];
    if(whites.some(n=>n<1||n>69)||pb<1||pb>26){alert('番号の範囲が違います');return;}
    const key=ticketKey(whites,pb);
    if(pastNumbers.find(p=>p.key===key)){alert('すでに登録済みです');return;}
    pastNumbers.push({key,label:whites.join('-')+'  PB:'+pb,date:''});
    savePast(); document.getElementById('past-input').value=''; renderPastList(); computeStats();
  }
  function deletePast(key){pastNumbers=pastNumbers.filter(p=>p.key!==key);savePast();renderPastList();computeStats();}
  function clearAll(){if(!confirm('全件削除しますか？'))return;pastNumbers=[];savePast();renderPastList();computeStats();}
  function savePast(){localStorage.setItem('past-numbers',JSON.stringify(pastNumbers));document.getElementById('past-count').textContent=pastNumbers.length+'件';}
  function renderPastList(){
    document.getElementById('past-count').textContent=pastNumbers.length+'件';
    const list=document.getElementById('past-list');
    if(!pastNumbers.length){list.innerHTML='<div style="font-size:12px;color:#555;text-align:center;padding:12px;">登録なし</div>';return;}
    list.innerHTML=[...pastNumbers].reverse().map(p=>`<div class="past-item"><div>${p.date?`<div class="past-item-date">${p.date}</div>`:''}<div class="past-item-nums">${p.label}</div></div><button class="past-item-del" onclick="deletePast('${p.key}')">✕</button></div>`).join('')+
    `<button onclick="clearAll()" style="width:100%;margin-top:8px;padding:8px;border-radius:8px;border:1px solid #3a1a1a;background:transparent;color:#664444;font-size:11px;cursor:pointer;">🗑 全件削除</button>`;
  }

  renderPastList(); computeStats();
</script>
</body>
</html>
